name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]  # rag usa la 3.11, atti-pa la 3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: LibreOffice (DOC, DOCX, RTF, HTML)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - run: pip install ".[tutto,test]"  # anche gli SDK dei fornitori OCR
      - run: pytest -q
